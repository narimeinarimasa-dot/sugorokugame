<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTHER鉄道 - お母さん誕生日おめでとう</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 10px; margin: 0; }
        h1 { font-size: 24px; margin: 15px 0; color: #fcc419; text-shadow: 2px 2px #cc1111; }
        .window { border: 4px solid #fff; padding: 15px; margin: 10px auto; max-width: 90%; background: #000; border-radius: 8px; box-shadow: inset 0 0 10px #fff; text-align: left; min-height: 80px; white-space: pre-wrap; font-size: 16px; line-height: 1.5; }
        .btn { background: #000; color: #fff; border: 3px solid #fff; padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 90%; max-width: 400px; margin: 10px 0; }
        .btn:disabled { border-color: #555; color: #555; cursor: not-allowed; }
        .btn:active:not(:disabled) { background: #fff; color: #000; }
        
        #setup { text-align: center; }
        #setup input { display: block; margin: 0 auto 15px auto; width: 80%; padding: 12px; font-size: 16px; background: #000; color: #fff; border: 2px solid #fff; border-radius: 5px; text-align: center; }

        .status-card { border: 2px solid #fff; background: #000; padding: 10px; border-radius: 5px; width: 43%; box-sizing: border-box; font-size: 13px; text-align: left; line-height: 1.4; }
        .status-name { font-weight: bold; color: #fcc419; border-bottom: 1px solid #fff; padding-bottom: 3px; margin-bottom: 5px; }

        .map-container { display: flex; flex-direction: column; align-items: center; margin: 25px auto; width: 90%; gap: 15px; }
        .mass { width: 85%; height: 60px; border: 3px solid #fff; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #111; box-sizing: border-box; position: relative; }
        .mass-title { font-weight: bold; font-size: 14px; }
        .pieces-area { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 5px; min-width: 60px; justify-content: center; }
        .piece { width: 16px; height: 16px; border-radius: 50%; display: inline-block; position: relative; }
        .piece-name { font-size: 8px; color: #fff; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
    </style>
</head>
<body>

    <h1>▼ ＭＯＴＨＥＲ 鉄道</h1>
    
    <!-- 参加画面 -->
    <div id="setup" class="window">
        <p>あなたの 名前を おしえてください。</p>
        <input type="text" id="nameInput" placeholder="お母さん、〇〇、など">
        <center><button class="btn" onclick="joinGame()">ゲームを はじめる</button></center>
    </div>

    <!-- ゲーム画面 -->
    <div id="gameRoom" style="display: none;">
        <div class="window" id="msgWindow">待機中...家族全員が参加したらサイコロを振ってね！</div>

        <!-- アイテム使用エリア -->
        <div id="useItemArea" style="display: none; margin: 10px auto; max-width: 90%; background: #111; border: 2px dashed #fff; padding: 10px; border-radius: 5px;">
            <span style="font-size:14px; color:#aaa;">🎒 アイテムを使う：</span>
            <select id="itemSelect" style="padding: 8px; background: #000; color: #fff; border: 1px solid #fff; border-radius: 3px; font-size: 14px; max-width: 60%;"></select>
            <button onclick="clickUseItem()" style="background: #15051a; color: #b84dff; border: 2px solid #b84dff; padding: 6px 12px; font-size: 14px; font-weight: bold; border-radius: 3px; cursor: pointer; margin-left: 5px;">つかう</button>
        </div>

        <center>
            <button class="btn" id="rollBtn" onclick="rollDice()">サイコロを振る！</button>
            <button class="btn" id="attackBtn" onclick="attackEnemy()" style="display: none; background: #220000; border-color: #ff3333; color: #ff9999;">⚔️ たたかう</button>
            
            <!-- SHOP用ボタンエリア -->
            <div id="shopArea" style="display: none; width: 100%;">
                <div id="shopMenuButtons">
                    <button class="btn" onclick="selectShopMenu('status')" style="background:#05101a; border-color:#4dadff;">📈 ステータスを買う</button>
                    <button class="btn" onclick="selectShopMenu('item')" style="background:#15051a; border-color:#b84dff;">🎒 アイテムを買う</button>
                </div>
                <div id="shopStatusButtons" style="display: none;">
                    <button class="btn" onclick="buyStatus('hp')" style="font-size:15px; width:43%; margin:5px;">❤️ HPアップ (50＄)</button>
                    <button class="btn" onclick="buyStatus('atk')" style="font-size:15px; width:43%; margin:5px;">⚔️ OFアップ (50＄)</button>
                    <button class="btn" onclick="buyStatus('def')" style="font-size:15px; width:43%; margin:5px;">🛡️ DFアップ (50＄)</button>
                </div>
                <div id="shopItemButtons" style="display: none;">
                    <button class="btn" onclick="buyItem('ち力のバット')" style="font-size:14px; width:90%; margin:5px;">🏏 ち力のバット (50＄) [OF+5]</button>
                    <button class="btn" onclick="buyItem('お母さんのおむすび')" style="font-size:14px; width:90%; margin:5px;">🍙 お母さんのおむすび (30＄) [HP+30]</button>
                    <button class="btn" onclick="buyItem('急行カード')" style="font-size:14px; width:90%; margin:5px;">🎫 急行カード (40＄) [サイコロ2個]</button>
                </div>
                <button class="btn" onclick="leaveShop()" style="background:#111; border-color:#fff; margin-top:10px;">🚪 お店を出る</button>
            </div>
        </center>

        <div id="statusArea" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 15px auto; max-width: 90%;"></div>

        <div class="map-container" id="dynamicMap"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // 50マスのタイトル自動生成
        const massTitles = { 0: "🏁 0: スタート", 50: "🎉 50: ゴール！" };
        for (let i = 1; i < 50; i++) {
            if ([5, 15, 25, 35, 45].includes(i)) massTitles[i] = `🛒 ${i}: SHOPマス`;
            else if ([2, 10, 18, 28, 38, 48].includes(i)) massTitles[i] = `🎁 ${i}: アイテムマス`;
            else massTitles[i] = `💬 ${i}: 通常マス`;
        }

        const mapContainer = document.getElementById('dynamicMap');
        if (mapContainer && mapContainer.children.length === 0) {
            for (let i = 50; i >= 0; i--) { // ★50から逆順生成
                const massDiv = document.createElement('div');
                massDiv.className = 'mass';
                massDiv.id = `m${i}`;
                
                if (i === 50) {
                    massDiv.style.borderColor = '#ff6b6b';
                    massDiv.style.background = '#221111';
                } else if (i === 0) {
                    massDiv.style.borderColor = '#51cf66';
                } else if ([2, 10, 18, 28, 38, 48].includes(i)) {
                    massDiv.style.borderColor = '#fcc419';
                    massDiv.style.background = '#1a1505';
                } else if ([5, 15, 25, 35, 45].includes(i)) {
                    massDiv.style.borderColor = '#4dadff';
                    massDiv.style.background = '#05101a';
                }

                massDiv.innerHTML = `<span class="mass-title">${massTitles[i]}</span><div class="pieces-area" id="p${i}"></div>`;
                mapContainer.appendChild(massDiv);
            }
        }

        function joinGame() {
            const name = document.getElementById('nameInput').value.trim();
            if(!name) return alert('名前を入力してください！');
            socket.emit('join_game', { name: name });
            document.getElementById('setup').style.display = 'none';
            document.getElementById('gameRoom').style.display = 'block';
        }

        function rollDice() {
            socket.emit('roll_dice');
        }

        function clickUseItem() {
            const select = document.getElementById('itemSelect');
            if (select && select.value !== "") {
                socket.emit('use_item', parseInt(select.value));
            }
        }

        function attackEnemy() {
            socket.emit('battle_attack');
        }

        function selectShopMenu(mode) {
            socket.emit('shop_select_menu', mode);
        }
        
        function buyStatus(type) {
            socket.emit('shop_buy_status', type);
        }

        function buyItem(itemName) {
            socket.emit('shop_buy_item', itemName);
        }
        
        function leaveShop() {
            socket.emit('shop_leave');
        }

        socket.on('state_update', (state) => {
            document.getElementById('msgWindow').innerText = state.currentMessage;

            for(let i = 0; i <= 50; i++) { // ★50マス分クリア
                const container = document.getElementById(`p${i}`);
                if(container) container.innerHTML = '';
            }

            Object.keys(state.players).forEach(id => {
                const p = state.players[id];
                const piece = document.createElement('div');
                piece.className = 'piece';
                piece.style.backgroundColor = p.color;
                
                if(id === socket.id) {
                    piece.style.boxShadow = "0 0 0 2px #fff";
                }

                const nameLabel = document.createElement('span');
                nameLabel.className = 'piece-name';
                nameLabel.innerText = p.name.substring(0, 3);
                piece.appendChild(nameLabel);

                const container = document.getElementById(`p${p.pos}`);
                if(container) container.appendChild(piece);
            });

            const statusArea = document.getElementById('statusArea');
            if (statusArea) {
                statusArea.innerHTML = ''; 

                Object.keys(state.players).forEach(id => {
                    const p = state.players[id];
                    const card = document.createElement('div');
                    card.className = 'status-card';
                    
                    if(id === socket.id) {
                        card.style.boxShadow = "0 0 8px rgba(255,255,255,0.8)";
                    }
                    
                    const itemListStr = p.items.length > 0 ? p.items.join(' , ') : "なし";

                    card.innerHTML = `
                        <div class="status-name" style="border-left: 4px solid ${p.color}; padding-left: 5px;">${p.name}</div>
                        <div>ＬＶ : ${p.lv}</div>
                        <div>ＨＰ : ${p.hp} / ${p.maxHp}</div>
                        <div>ＯＦ : ${p.attack}</div>
                        <div>ＤＦ : ${p.defence}</div>
                        <div>ＥＸ : ${p.ex}</div>
                        <div style="color: #fcc419; font-weight: bold;">💸＄ : ${p.money}</div>
                        <div style="color: #aaa; font-size: 11px; margin-top: 5px; border-top: 1px dashed #444; padding-top: 3px;">🎒 : ${itemListStr}</div>
                    `;
                    statusArea.appendChild(card);
                });
            }

            const currentTurnId = state.socketIds[state.turnIdx];
            const rollBtn = document.getElementById('rollBtn');
            const attackBtn = document.getElementById('attackBtn');
            const shopArea = document.getElementById('shopArea');
            const shopMenuButtons = document.getElementById('shopMenuButtons');
            const shopStatusButtons = document.getElementById('shopStatusButtons');
            const shopItemButtons = document.getElementById('shopItemButtons');
            const useItemArea = document.getElementById('useItemArea');
            
            const bState = state.battleState;
            const sState = state.shopState;

            rollBtn.style.display = 'none';
            attackBtn.style.display = 'none';
            shopArea.style.display = 'none';
            shopMenuButtons.style.display = 'none';
            shopStatusButtons.style.display = 'none';
            if (shopItemButtons) shopItemButtons.style.display = 'none';
            if (useItemArea) useItemArea.style.display = 'none';

            if (bState && bState.inBattle) {
                attackBtn.style.display = 'block'; 
                if (bState.activePlayerId === socket.id) {
                    attackBtn.disabled = false;
                    attackBtn.innerText = `⚔️ たたかう (${bState.enemies.length}体残る)`;
                } else {
                    attackBtn.disabled = true;
                    const pName = state.players[bState.activePlayerId] ? state.players[bState.activePlayerId].name : "誰か";
                    attackBtn.innerText = `⚔️ ${pName}が 戦闘中...`;
                }
            } 
            else if (sState && sState.inShop) {
                shopArea.style.display = 'block';
                
                if (sState.mode === 'menu') {
                    shopMenuButtons.style.display = 'block';
                } else if (sState.mode === 'status') {
                    shopStatusButtons.style.display = 'block';
                } else if (sState.mode === 'item') {
                    if (shopItemButtons) shopItemButtons.style.display = 'block';
                }

                const isMyShop = (sState.activePlayerId === socket.id);
                const allShopBtns = shopArea.getElementsByTagName('button');
                for (let btn of allShopBtns) {
                    if (!btn.innerText.includes("準備中")) {
                        btn.disabled = !isMyShop;
                    }
                }
                
                if (!isMyShop) {
                    const pName = state.players[sState.activePlayerId] ? state.players[sState.activePlayerId].name : "誰か";
                    document.getElementById('msgWindow').innerText = `🛒 ${pName}が お買い物しています...`;
                }
            } 
            else {
                rollBtn.style.display = 'block'; 
                if (currentTurnId === socket.id) {
                    rollBtn.disabled = false;
                    rollBtn.innerText = "▶ あなたの番です！サイコロを振る";
                    
                    const myPlayer = state.players[socket.id];
                    if (useItemArea && myPlayer && myPlayer.items.length > 0) {
                        useItemArea.style.display = 'block';
                        const select = document.getElementById('itemSelect');
                        select.innerHTML = '';
                        
                        myPlayer.items.forEach((item, index) => {
                            const opt = document.createElement('option');
                            opt.value = index;
                            opt.innerText = item;
                            select.appendChild(opt);
                        });
                    }
                } else {
                    rollBtn.disabled = true;
                    const turnName = state.players[currentTurnId] ? state.players[currentTurnId].name : "誰か";
                    rollBtn.innerText = `${turnName}の 番を 待っています...`;
                }
            }
        });
    </script>
</body>
</html>
